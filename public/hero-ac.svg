<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" fill="none" role="img" aria-label="Nástenná klimatizačná jednotka Montex s jemným prúdením chladného vzduchu">
  <circle cx="300" cy="230" r="220" fill="#F3ECE2"/>

  <!-- wall shading -->
  <rect x="60" y="40" width="440" height="380" rx="28" fill="#FFFDFA"/>

  <!-- breeze waves -->
  <path d="M120 190c50 24 90 24 140 0s90-24 140 0 90 24 140 0" stroke="#8FC4C9" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <path d="M110 232c50 26 90 26 140 0s90-26 140 0 90 26 140 0" stroke="#5AA3AA" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <path d="M130 274c46 22 84 22 128 0s84-22 128 0 84 22 128 0" stroke="#C3E2E4" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

  <!-- leaves drifting in the breeze -->
  <path d="M158 314c10-14 28-16 40-6 -6 16-24 24-40 18-6-2-4-8 0-12z" fill="#EFB08A"/>
  <path d="M400 300c10-14 28-16 40-6 -6 16-24 24-40 18-6-2-4-8 0-12z" fill="#D66A3F" opacity="0.85"/>

  <!-- AC unit -->
  <rect x="150" y="96" width="260" height="86" rx="24" fill="#0B343A"/>
  <rect x="150" y="96" width="260" height="86" rx="24" fill="#12454C" opacity="0.0"/>
  <rect x="172" y="130" width="216" height="8" rx="4" fill="#5AA3AA" opacity="0.8"/>
  <rect x="172" y="146" width="216" height="8" rx="4" fill="#5AA3AA" opacity="0.55"/>
  <rect x="172" y="162" width="140" height="8" rx="4" fill="#5AA3AA" opacity="0.35"/>
  <circle cx="382" cy="112" r="6" fill="#D66A3F"/>

  <!-- mount shadow -->
  <rect x="150" y="182" width="260" height="10" rx="5" fill="#06262A" opacity="0.12"/>
</svg>
